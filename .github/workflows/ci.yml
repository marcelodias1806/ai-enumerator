name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-and-static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app scripts alembic

      - name: Run tests
        run: pytest -q

      - name: Check JavaScript syntax
        run: |
          node --check app/static/dashboard.js
          node --check app/static/exposure.js
          node --check app/static/assessment.js
          node --check app/static/intelligence.js

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
